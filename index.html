<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ambiguo — Cantina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <img class="brand-full" src="assets/logo-ambiguo.png" alt="Ambiguo" />
          <img class="brand-mark" src="assets/favicon.png" alt="Ambiguo" />
        </div>
      </div>
      <nav class="nav" aria-label="Navigazione principale">
        <button class="nav-link active" data-view="dashboard" title="Dashboard"><span class="nav-icon">⌂</span><span class="nav-label">Dashboard</span></button>
        <button class="nav-link" data-view="cantina" title="Cantina"><span class="nav-icon">◇</span><span class="nav-label">Cantina</span></button>
        <button class="nav-link" data-view="ordini" title="Ordini distributori"><span class="nav-icon">↙</span><span class="nav-label">Ordini dist.</span></button>
        <button class="nav-link" data-view="vendite" title="Ordini clienti"><span class="nav-icon">↗</span><span class="nav-label">Ordini clienti</span></button>
        <button class="nav-link" data-view="clienti" title="Clienti"><span class="nav-icon">◎</span><span class="nav-label">Clienti</span></button>
        <button class="nav-link" data-view="distributori" title="Distributori"><span class="nav-icon">▣</span><span class="nav-label">Distributori</span></button>
        <button class="nav-link" data-view="impostazioni" title="Impostazioni"><span class="nav-icon">⚙</span><span class="nav-label">Impostazioni</span></button>
      </nav>
      <div class="sidebar-collapse-row">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Riduci barra laterale" aria-expanded="true" title="Riduci menu">
          <span class="nav-icon toggle-open">←</span>
          <span class="nav-icon toggle-closed">→</span>
        </button>
      </div>
      <div class="sidebar-actions">
        <button class="btn primary full" id="quickOrderBtn" title="Nuovo ordine"><span class="action-icon">＋</span><span class="action-label">Nuovo ordine</span></button>
        <button class="btn ghost full" id="quickSaleBtn" title="Nuovo ordine cliente"><span class="action-icon">↗</span><span class="action-label">Nuovo ordine cliente</span></button>
        <button class="btn ghost full" id="quickWineBtn" title="Nuovo vino"><span class="action-icon">◇</span><span class="action-label">Nuovo vino</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Ambiguo cellar system</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <div class="notifications-wrap">
            <button class="icon-btn notification-trigger" id="notificationBtn" type="button" aria-label="Apri notifiche" aria-expanded="false">
              <span class="bell-icon">♢</span>
              <span class="notification-dot" id="notificationDot" hidden></span>
            </button>
            <div class="notification-menu" id="notificationMenu" hidden>
              <div class="notification-menu-head">
                <div>
                  <strong>Notifiche</strong>
                  <span id="notificationSubtitle">Ordini da controllare</span>
                </div>
                <button class="mini-link" id="notificationClose" type="button">Chiudi</button>
              </div>
              <div class="notification-menu-body" id="notificationList"></div>
            </div>
          </div>
          <input id="globalSearch" class="search" type="search" placeholder="Cerca codice, vino, cantina, distributore…" />
          <button class="btn secondary" id="exportCsvBtn">Esporta CSV</button>
        </div>
      </header>

      <section id="view-dashboard" class="view active"></section>
      <section id="view-cantina" class="view"></section>
      <section id="view-ordini" class="view"></section>
      <section id="view-vendite" class="view"></section>
      <section id="view-clienti" class="view"></section>
      <section id="view-distributori" class="view"></section>
      <section id="view-impostazioni" class="view"></section>
    </main>
  </div>

  <div id="modalRoot" class="modal-root" aria-live="polite"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
